name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - name: Test
        run: |
          go test -race ./...
          go vet ./...
      - name: Install desktop validator
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Build packages and check startup
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: python3 scripts/package.py --version "$RELEASE_VERSION" --arch "$RELEASE_ARCH" --appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          sha256sum -- *.tar.gz *.AppImage > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Islander 终端客户端，包含交互式 TUI 和 JSON CLI。

          Go 安装：`go install github.com/A-islander/islander-cli/cmd/islander@latest`

          压缩包解压后运行 `./islander tui`；AppImage 不带参数直接打开 TUI。
          `--version` 查看版本。Linux x86_64、aarch64 分别提供压缩包和 AppImage；下载后可用 SHA256SUMS 校验。
          NOTES
          gh release create "$RELEASE_VERSION" --verify-tag --title "Islander $RELEASE_VERSION" --notes-file release-notes.md *.tar.gz *.AppImage SHA256SUMS
