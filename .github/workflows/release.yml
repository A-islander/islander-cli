name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (manual runs only validate packages; they do not publish)'
        required: true
        default: v0.0.2

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: x86_64
            runner: macos-15-intel
          - os: macos
            arch: aarch64
            runner: macos-15
          - os: windows
            arch: x86_64
            runner: windows-2025
          - os: windows
            arch: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF_TYPE" == tag ]]
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - name: Test
        run: |
          go test ./...
          go vet ./...
      - name: Race tests
        if: matrix.os == 'linux'
        run: go test -race ./...
      - name: Install desktop validator
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Build packages and check startup
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_OS: ${{ matrix.os }}
        run: |
          extra=()
          if [[ "$RELEASE_OS" == linux ]]; then extra+=(--appimage); fi
          python scripts/package.py --version "$RELEASE_VERSION" --os "$RELEASE_OS" --arch "$RELEASE_ARCH" "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 2
          sha256sum -- *.tar.gz *.AppImage *.zip *.exe > SHA256SUMS
          gh release create "$RELEASE_VERSION" --verify-tag --title "Islander $RELEASE_VERSION" --notes-file "../docs/releases/$RELEASE_VERSION.md" *.tar.gz *.AppImage *.zip *.exe SHA256SUMS
